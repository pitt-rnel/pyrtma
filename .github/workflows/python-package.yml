# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build and test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint with black
        if: ${{ matrix.python-version == '3.14' }}
        uses: psf/black@stable
      # Pyright checks for Python 3.10 whatever runs it (pyproject.toml), so
      # one entry is enough.
      - name: Type check with pyright
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: pyright
      - name: Test compiler
        run: |
          python -m pyrtma.compile -i tests/test_msg_defs/test_defs.yaml --py -o tests/test_msg_defs -n test_defs
      # The toolchain tests in tests/test_compilers.py check more, but skip
      # when gcc or node is missing; these steps can't skip.
      - name: Check generated C and JavaScript
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          out=build/compiled
          mkdir -p "$out"
          python -m pyrtma.compile -i tests/compiler_defs/core_c.defs --c -o "$out" -n core
          for defs in tests/test_msg_defs/test_defs.yaml tests/compiler_defs/compiler_defs.defs; do
            name=$(basename "${defs%.*}")
            python -m pyrtma.compile -i "$defs" --c --js -o "$out" -n "$name"
            # core.h stands in for rtma.h, which C clients include first.
            printf '#include "core.h"\n#include "%s.h"\n' "$name" | gcc -fsyntax-only -std=c11 -Wall -Werror -I "$out" -x c -
            # The output is an ES module; as .mjs, node loads it as one.
            cp "$out/$name.js" "$out/$name.mjs"
            node --input-type=module -e "const { RTMA } = await import('./$out/$name.mjs'); for (const kind of ['SDF', 'MDF']) for (const make of Object.values(RTMA[kind])) make();"
          done
      - name: Test with pytest
        run: |
          python -m pytest
