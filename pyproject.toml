[build-system]
requires = ["setuptools>=61.0", "packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrtma"
# version defined in pyrtma.__version__.py
authors = [
  { name="David Weir", email="dmw109@pitt.edu" },
  { name="Jeff Weiss", email="jmw182@pitt.edu" },
  { name="Tyler Madonna", email="tjm159@pitt.edu" },
  { name="Tyler Simpson", email="tws21@pitt.edu" },
]
description = "A Python client for RTMA/Dragonfly"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

dependencies = [
  "ruamel.yaml",
  "websocket-server",
  "rich",
  "black",
  "packaging",
]
[project.optional-dependencies]
# pytest before 8.4 swaps threading.excepthook around each test phase, which
# hides thread exceptions from the thread_exceptions fixture in tests/conftest.py.
dev = ["pyright", "pytest>=8.4", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pyrtma.__version__.__version__"}

[tool.setuptools.package-data]
pyrtma = ["py.typed", "*.yaml"]

[tool.black]
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "--strict-markers"
markers = [
  "integration: starts a message manager or opens sockets",
  "toolchain: needs gcc or node on PATH; skipped when they are missing",
  "manager_options(**kwargs): MessageManager keyword arguments for the manager and bare_manager fixtures",
]

[tool.pyright]
include = ["src", "tests"]
# Generated definition files are left out; they are still analyzed where imported.
exclude = [
  "**/__pycache__",
  "src/pyrtma/core_defs.py",
  "tests/test_msg_defs/test_defs.py",
]
typeCheckingMode = "basic"
pythonVersion = "3.10"

[project.urls]
"Homepage" = "https://github.com/pitt-rnel/pyrtma"
"Bug Tracker" = "https://github.com/pitt-rnel/pyrtma/issues"

[project.scripts]
message_manager = "pyrtma.manager:main"
web_manager = "pyrtma.web_manager:main"
rtma_compiler = "pyrtma.compile:main"
data_logger = "pyrtma.data_logger.__main__:main"
data_logger_cli = "pyrtma.data_logger.cli:main"