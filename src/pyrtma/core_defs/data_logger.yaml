# DataLogger Message Definitions
# Unused legacy RTMA_types were repurposed here

constants:
  MAX_DATASETS: 6
  DATASET_NAME_LEN: 32
  DATASET_SAVE_PATH_LEN: 256  # DATASET save_path, with its null terminator
  DATASET_FILENAME_LEN: 128  # DATASET filename, with its null terminator
  DATASET_FORMATTER_LEN: 32  # DATASET formatter, with its null terminator
  DATASET_MAX_MSG_TYPES: 64  # Message types one DATASET can list
  DATASET_MAX_SIZE_MB: 1000  # Largest allowed DATASET max_size_mb: 1 GB, in MB of 1,000,000 bytes

struct_defs:
  DATASET:
    fields:
        name: char[DATASET_NAME_LEN]
        save_path: char[DATASET_SAVE_PATH_LEN]      # Dataset save directory
        filename: char[DATASET_FILENAME_LEN]       # Dataset saved file name without the file extension
        formatter: char[DATASET_FORMATTER_LEN]       # Builtin Options: quicklogger, json, raw, msg_header
        max_size_mb: int32        # Largest file in MB (1 to DATASET_MAX_SIZE_MB, or 0 for DATASET_MAX_SIZE_MB); a full file continues in a new one
        msg_types: int32[DATASET_MAX_MSG_TYPES]      # Message type ids that should be passed to dataset formatter

message_defs:
  DATASET_STATUS_REQUEST:
    id: 62
    fields:
      name: char[DATASET_NAME_LEN]

  DATASET_STATUS:
    id: 63
    fields:
      name: char[DATASET_NAME_LEN]
      timestamp: double
      elapsed_time: double
      is_recording: int32
      is_paused: int32

  DATASET_ADD:
    id: 64
    fields:
        dataset: DATASET

  DATASET_ADDED:
    id: 65
    fields:
      name: char[DATASET_NAME_LEN]

  DATASET_REMOVE:
    id: 66
    fields:
      name: char[DATASET_NAME_LEN]

  DATASET_REMOVED:
    id: 67
    fields:
      name: char[DATASET_NAME_LEN]

  DATA_LOGGER_CONFIG_REQUEST:
    id: 68
    fields: null

  DATA_LOGGER_CONFIG:
    id: 69
    fields:
        num_datasets: int32
        datasets: DATASET[MAX_DATASETS]

  DATASET_STARTED:
    id: 70
    fields:
      name: char[DATASET_NAME_LEN]

  DATASET_STOPPED:
    id: 71
    fields:
      name: char[DATASET_NAME_LEN]

  DATASET_SAVED:
    id: 72
    fields:
      name: char[DATASET_NAME_LEN]
      filepath: char[1024]

  DATASET_START:
    id: 73
    fields:
      name: char[DATASET_NAME_LEN]

  DATASET_STOP:
    id: 74
    fields:
      name: char[DATASET_NAME_LEN]

  DATASET_PAUSE:
    id: 75
    fields:
      name: char[DATASET_NAME_LEN]

  DATASET_RESUME:
    id: 76
    fields:
      name: char[DATASET_NAME_LEN]

  DATA_LOGGER_RESET:
    id: 77
    fields: null

  DATA_LOGGER_ERROR:
    id: 78
    fields:
      dataset_name: char[DATASET_NAME_LEN]
      exc_type: char[64]
      msg: char[512]

  DATA_LOG_TEST_2048:
    id: 79
    fields:
      raw: char[2048]

  # TIMING_MESSAGE: 81
  # FORCE_DISCONNECT: 82
  # MM_ERROR: 83
  # MM_INFO: 84
  # PAUSE_SUBSCRIPTION: 85
  # RESUME_SUBSCRIPTION: 86
